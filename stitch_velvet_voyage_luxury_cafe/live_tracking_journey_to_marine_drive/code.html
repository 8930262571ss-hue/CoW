<!DOCTYPE html>

<style>
        .map-bg {
            /* Simulated map texture */
            background-color: #141310;
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(201, 166, 103, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(201, 166, 103, 0.05) 0%, transparent 40%);

<body class="bg-background text-on-background font-body-md h-screen w-screen overflow-hidden relative noise-overlay">
<!-- Top AppBar Semantic Shell (Hidden on this transactional/focused screen as per rules, but included if forced by logic. The prompt implies a full-bleed map focus. We'll add a minimal back button instead of the full nav shell to prioritize the canvas, adhering to 'Automatic Suppression' rule for 'Linear/Transactional' intent.) -->
<div class="absolute top-0 left-0 w-full z-50 p-container-margin pointer-events-none flex justify-between items-start">
<!-- Top Left: Trip Info Overlay -->
<div class="pointer-events-auto bg-surface-container/80 backdrop-blur-md border border-tertiary/30 rounded-lg overflow-hidden shadow-2xl max-w-sm w-full">
<div class="p-4 flex items-center justify-between border-b border-tertiary/10">
<button class="p-2 text-on-surface-variant hover:text-tertiary transition-colors duration-300 rounded-full hover:bg-surface-container-high">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<div class="flex-1 text-center font-display-lg text-headline-md text-tertiary italic tracking-tight">
                    Café on Wheels
                </div>
<div class="w-10"></div> <!-- Spacer for center alignment -->
</div>
<div class="p-6 relative">
<h2 class="font-headline-lg text-headline-lg-mobile md:text-headline-lg text-on-surface mb-2">En Route to Marine Drive</h2>
<div class="flex flex-col gap-unit mt-4">
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">ETA</span>
<span class="font-price-display text-price-display text-tertiary">12 mins</span>
</div>
<div class="flex justify-between items-center">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest">Distance Remaining</span>
<span class="font-body-lg text-body-lg text-on-surface">3.2 km</span>
</div>
</div>
<!-- Progress Line -->
<div class="absolute bottom-0 left-0 w-full h-1 bg-surface-container-highest">
<div class="h-full bg-gradient-to-r from-tertiary to-tertiary-fixed w-3/4 glow-line"></div>
</div>
</div>
</div>
<!-- Top Right: Chauffeur Profile -->
<div class="pointer-events-auto bg-surface-container/80 backdrop-blur-md border border-tertiary/30 rounded-full p-2 flex items-center gap-4 shadow-lg pr-6 mt-4 md:mt-0">
<div class="relative w-12 h-12 rounded-full overflow-hidden border border-tertiary/50">
<img class="w-full h-full object-cover" data-alt="A professional male chauffeur in a tailored dark charcoal suit with a subtle gold lapel pin, smiling warmly. Set against a dark, blurred background to emphasize elegance and luxury. High contrast, sophisticated lighting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuA4k8q0oJlMGfnQWN1rnErZHKehUfn9baTKffL7wHgOLkvESOBYhzBJbowO77CUiIoKqD6S949w9L4bYQZuskbLTpi6efbGUgImGGpjOBYjMrTtWuWJfujRNvRezDOrc5BwZWBQ3YgNLh70nsh8VY4NGfzCOvWQBoxZMpLBxAPxcHpKa6svruSVyVedD-_WqndjbNjcheHD04jYaxR56YXkC9YCUm_1hSd0mjHCQk2EI3l9VeJpRi4"/>
</div>
<div class="flex flex-col">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase">Chauffeur</span>
<span class="font-body-md text-body-md text-on-surface font-bold">Vikram S.</span>
</div>
<div class="flex gap-2 ml-4">
<button class="w-10 h-10 rounded-full border border-tertiary/50 flex items-center justify-center text-tertiary hover:bg-tertiary/10 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">call</span>
</button>
<button class="w-10 h-10 rounded-full border border-tertiary/50 flex items-center justify-center text-tertiary hover:bg-tertiary/10 transition-colors">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">chat</span>
</button>
</div>
</div>
</div>
<!-- Map Canvas (Simulated) -->
<div class="absolute inset-0 z-0 map-bg flex items-center justify-center relative overflow-hidden" data-location="Marine Drive, Mumbai" style="">
<!-- We use an image with object-cover as a fallback map layer if needed, but styling provides the primary dark map feel -->
<div class="absolute inset-0 bg-cover bg-center opacity-60" data-alt="A highly detailed, stylized dark-mode map of a coastal city resembling Marine Drive. The terrain is a deep, velvety charcoal black. The roads are depicted as ultra-thin, elegant gold lines. A prominent, glowing champagne-gold route line traces a path along the coast. The aesthetic is luxurious, modern, and cinematic, emphasizing high contrast between the dark background and the glowing gold route." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuCACRta3MFF9Xjt_LC4b9q-ikNENPj7pwVdUMpLkLvx5_fmqxsCQqntrKxmi2SK9g5wSAWJu1-WFeKbJFsJiHn15_j486FfnDoyJdha3jaO5-VgYdVapG2_NfKFsQSe4Qmlb0KlS4bAfd80fevrS2q8oldTVo8QRm4iz6xQQzaxdXJb40enEF2VzAZ10PHbSOHLZJpLGr4Yr0Xc1Mx45RfTX0qWGwGKp3S_xb6GsCWC-b3bzUpFr0w')"></div>
<!-- Simulated Route Line (SVG overlay) -->
<svg class="absolute inset-0 w-full h-full pointer-events-none z-10" preserveaspectratio="xMidYMid slice" viewbox="0 0 1000 800">
<path d="M 200,600 Q 300,500 450,550 T 700,300" fill="none" stroke="rgba(230, 193, 128, 0.2)" stroke-dasharray="10 5" stroke-width="4"></path>
<path class="glow-line" d="M 450,550 T 700,300" fill="none" stroke="#e6c180" stroke-linecap="round" stroke-width="6"></path>
</svg>
<!-- Map Markers (Positioned absolutely over the simulated map) -->
<!-- Origin / Passed Stop -->
<div class="absolute z-20 top-[60%] left-[20%] transform -translate-x-1/2 -translate-y-1/2 flex flex-col items-center">
<div class="w-6 h-6 rounded-full bg-surface-variant border-2 border-outline-variant flex items-center justify-center">
<span class="material-symbols-outlined text-[14px] text-on-surface-variant" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Active Van Marker -->
<div class="absolute z-30 top-[55%] left-[45%] transform -translate-x-1/2 -translate-y-1/2">
<div class="relative w-16 h-16 bg-surface border-2 border-tertiary rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(230,193,128,0.3)] animate-pulse">
<span class="material-symbols-outlined text-tertiary text-3xl" style="font-variation-settings: 'FILL' 1;">airport_shuttle</span>
<!-- Directional Arrow -->
<div class="absolute -top-2 text-tertiary">
<span class="material-symbols-outlined text-sm">navigation</span>
</div>
</div>
</div>
<!-- Destination Pin -->
<div class="absolute z-20 top-[30%] left-[70%] transform -translate-x-1/2 -translate-y-[100%] flex flex-col items-center">
<div class="bg-tertiary text-primary-container px-3 py-1 rounded font-label-caps text-label-caps mb-2 shadow-lg whitespace-nowrap">
                Marine Drive
            </div>
<div class="w-8 h-8 text-tertiary flex items-center justify-center glow-line rounded-full bg-surface">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">location_on</span>
</div>
</div>
</div>
<!-- Bottom Sheet Summary -->
<div class="absolute bottom-0 left-0 w-full z-40 p-container-margin md:p-section-gap flex justify-center pointer-events-none">
<div class="pointer-events-auto bg-surface/90 backdrop-blur-xl border border-tertiary/20 rounded-xl shadow-2xl w-full max-w-4xl overflow-hidden">
<div class="flex flex-col md:flex-row items-center justify-between p-6 gap-6">
<!-- Experience Details -->
<div class="flex items-center gap-6 w-full md:w-auto">
<div class="w-16 h-16 rounded bg-surface-container-high border border-tertiary/30 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-tertiary text-3xl" style="font-variation-settings: 'FILL' 0;">wine_bar</span>
</div>
<div>
<h3 class="font-headline-md text-headline-md text-on-surface">Midnight Soiree Theme</h3>
<p class="font-body-md text-body-md text-on-surface-variant flex items-center gap-2 mt-1">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 0;">group</span> 2 Guests
                        </p>
</div>
</div>
<!-- Financials & Action -->
<div class="flex flex-col md:flex-row items-end md:items-center gap-4 md:gap-8 w-full md:w-auto border-t md:border-t-0 md:border-l border-tertiary/20 pt-4 md:pt-0 md:pl-8 mt-4 md:mt-0">
<div class="text-right md:text-left w-full md:w-auto">
<span class="font-label-caps text-label-caps text-on-surface-variant uppercase tracking-widest block mb-1">Total Paid</span>
<span class="font-price-display text-price-display text-tertiary block">₹16,910</span>
</div>
<a class="font-label-caps text-label-caps text-on-surface-variant hover:text-tertiary transition-colors underline decoration-tertiary/30 underline-offset-4 mt-2 md:mt-0" href="#">
                        Contact Support
                    </a>
</div>
</div>
</div>
</div>
