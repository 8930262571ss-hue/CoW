version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: cafe_on_wheels_mongo
    restart: always
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: cafe_on_wheels
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: cafe_on_wheels_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
      - MONGODB_DB_NAME=cafe_on_wheels
      - JWT_SECRET_KEY=velvet_gold_super_secret_jwt_key_2026_cafe_wheels
      - FRONTEND_URL=http://localhost:5173
      - PAYU_SIMULATED_MODE=true
    depends_on:
      - mongodb

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: cafe_on_wheels_frontend
    restart: always
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8000/api
    depends_on:
      - backend

volumes:
  mongo_data:
